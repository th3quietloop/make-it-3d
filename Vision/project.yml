name: MakeIt3DVision

options:
  bundleIdPrefix: com.russellwhite.makeit3d
  createIntermediateGroups: true
  deploymentTarget:
    visionOS: "26.0"
    # 26 rather than the Mac app's 15, because the workbench is only ever run on
    # this machine and the composition API the player is built on
    # (AVVideoComposition.Configuration) replaced the mutable classes at 26.
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

    # Both targets, so the headset app can be installed on a device and the
    # workbench signs the same way. Set here rather than in Xcode's Signing and
    # Capabilities pane, because xcodegen writes the project from this file and
    # anything set in the UI is gone at the next generate.
    DEVELOPMENT_TEAM: 8J4SDPB6A2

    # Xcode recommends turning this on. It cannot be turned on here, and this
    # is measured rather than assumed: with ENABLE_USER_SCRIPT_SANDBOXING=YES
    # the build fails with
    #
    #   Sandbox: zsh deny(1) file-read-data Scripts/depth_sign_gate.sh
    #
    # The sandbox restricts a script phase to files it has declared as inputs
    # and outputs. The sign gate deliberately declares none: it compiles the
    # checker across every source folder with swiftc and does its own staleness
    # check by hashing them, which is what keeps an incremental build fast
    # without Xcode having to model the dependency.
    #
    # It could be made to fit by declaring every source file as an input, but
    # that list would then have to be kept in step with the sources by hand,
    # and a gate that silently stops running because someone added a file is
    # worse than no sandbox.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

    # The other half of Xcode's recommendation, and this one is free.
    DEAD_CODE_STRIPPING: "YES"

targets:

  # The headset app. Everything a person touches lives here.
  MakeIt3DVision:
    type: application
    platform: visionOS
    sources:
      - path: Sources/Format
      - path: Sources/Engine
      - path: Sources/Checks
      - path: Sources/App
    settings:
      base:
        # Automatic, so a team can be picked in Signing and Capabilities.
        # Signing was switched off entirely while this was simulator only,
        # which also switched off Xcode's ability to offer the choice.
        #
        # DEVELOPMENT_TEAM belongs here rather than in the Xcode UI. xcodegen
        # writes the project from this file, so a team set in the UI survives
        # exactly until the next `xcodegen generate` and then quietly goes
        # missing, which reads like a signing bug rather than a regenerated
        # file.
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.russellwhite.makeit3d.vision
        INFOPLIST_KEY_CFBundleDisplayName: Make It 3D
        ENABLE_PREVIEWS: "YES"
    preBuildScripts:
      # The stereo sign convention is measured, not assumed, and a flip fails
      # the build rather than shipping a film that reads inside out.
      - script: "\"$PROJECT_DIR/Scripts/depth_sign_gate.sh\""
        name: Depth sign convention gate
        basedOnDependencyAnalysis: false
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleName: Make It 3D
        CFBundleDisplayName: Make It 3D
        NSHumanReadableCopyright: "Make It 3D. A personal tool."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  # The Mac side of the workbench: writes fixtures and runs the gates. It shares
  # every line of format and engine code with the app, which is the point. A
  # gate that runs against a copy of the code is a gate that proves nothing.
  DepthTrackTool:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Format
      - path: Sources/Engine
        excludes:
          # Compiled from source at runtime by the tool, because a command line
          # tool has no bundle to hold a default.metallib.
          - "*.metal"
      - path: Sources/Checks
      - path: Tools/Gate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.russellwhite.makeit3d.depthtracktool
