name: MakeIt3D
options:
  bundleIdPrefix: com.russellwhite
  deploymentTarget:
    macOS: "15.0"
targets:
  # The target, the executable and the bundle stay MakeIt3D, one word, so
  # every script and shell path in this repo keeps working without quoting.
  # The name a person sees is CFBundleDisplayName, set below.
  MakeIt3D:
    type: application
    platform: macOS
    sources:
      - path: MakeIt3D
        excludes:
          - "Resources/Models/**"
          # Icon build artifacts, if regenerated in place.
          - "Resources/*.icns"
          - "Resources/*.iconset/**"
      - path: MakeIt3D/Resources/Models
        buildPhase: resources
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "Developer ID Application"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: 8J4SDPB6A2
        MARKETING_VERSION: "1.2.3"
        CURRENT_PROJECT_VERSION: "6"
        # Required by notarization. Nothing in this app needs an exception:
        # no JIT, no unsigned memory, no library validation to disable.
        ENABLE_HARDENED_RUNTIME: YES
        # Both of these are notarization requirements, and a plain xcodebuild
        # build satisfies neither by default. Apple rejected the first
        # submission for exactly these two reasons.
        #
        # A secure timestamp proves when the signature was made, so the app
        # keeps validating after the signing certificate expires. xcodebuild
        # only adds it when asked.
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
        # get-task-allow lets a debugger attach. Xcode injects it into every
        # non-archive build, and shipping it would mean shipping an app anyone
        # can attach to. Archiving strips it; this turns the injection off so a
        # plain build is distributable too.
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          # XCTest injection requires the host and test bundle to share a
          # development identity. Release keeps the Developer ID settings above.
          CODE_SIGN_IDENTITY: Apple Development
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
    info:
      path: MakeIt3D/Info.plist
      properties:
        NSHighResolutionCapable: true
        CFBundleName: Make It 3D
        CFBundleDisplayName: Make It 3D
        # Bound to the build settings rather than written twice. The plist held
        # a literal 1.0 while MARKETING_VERSION said 1.0.0, the literal won, and
        # the app reported a different version from the one the project claimed.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "Copyright 2026 Russell White. MIT licensed."
        # Declares that this app opens video, so Finder lists it under Open With.
        # Alternate rank rather than Owner: it converts video, it is not trying
        # to become the default player for every .mov on the machine.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie

  MakeIt3DTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MakeIt3DTests
    dependencies:
      - target: MakeIt3D
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: 8J4SDPB6A2
        CODE_SIGN_IDENTITY: Apple Development

schemes:
  MakeIt3D:
    build:
      targets:
        MakeIt3D: all
        MakeIt3DTests: [test]
    test:
      targets:
        - MakeIt3DTests
