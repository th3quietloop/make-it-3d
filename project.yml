name: MakeIt3D
options:
  bundleIdPrefix: com.russellwhite
  deploymentTarget:
    macOS: "15.0"
targets:
  # The target, the executable and the bundle stay MakeIt3D, one word, so
  # every script and shell path in this repo keeps working without quoting.
  # The name a person sees is CFBundleDisplayName, set below.
  MakeIt3D:
    type: application
    platform: macOS
    sources:
      - path: MakeIt3D
        excludes:
          - "Resources/Models/**"
          # Icon build artifacts, if regenerated in place.
          - "Resources/*.icns"
          - "Resources/*.iconset/**"
      - path: MakeIt3D/Resources/Models
        buildPhase: resources
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: MakeIt3D/Info.plist
      properties:
        NSHighResolutionCapable: true
        CFBundleName: Make It 3D
        CFBundleDisplayName: Make It 3D
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "Make It 3D. A personal tool."
