name: Relief
options:
  bundleIdPrefix: com.russellwhite
  deploymentTarget:
    macOS: "15.0"
targets:
  Relief:
    type: application
    platform: macOS
    sources:
      - path: Relief
        excludes:
          - "Resources/Models/**"
      - path: Relief/Resources/Models
        buildPhase: resources
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: Relief/Info.plist
      properties:
        NSHighResolutionCapable: true
        CFBundleName: Relief
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "Relief. A personal tool."
