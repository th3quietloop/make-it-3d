name: MakeIt3D
options:
  bundleIdPrefix: com.russellwhite
  deploymentTarget:
    macOS: "15.0"
targets:
  # The target, the executable and the bundle stay MakeIt3D, one word, so
  # every script and shell path in this repo keeps working without quoting.
  # The name a person sees is CFBundleDisplayName, set below.
  MakeIt3D:
    type: application
    platform: macOS
    sources:
      - path: MakeIt3D
        excludes:
          - "Resources/Models/**"
          # Icon build artifacts, if regenerated in place.
          - "Resources/*.icns"
          - "Resources/*.iconset/**"
      - path: MakeIt3D/Resources/Models
        buildPhase: resources
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "Developer ID Application"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: 8J4SDPB6A2
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # Required by notarization. Nothing in this app needs an exception:
        # no JIT, no unsigned memory, no library validation to disable.
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: MakeIt3D/Info.plist
      properties:
        NSHighResolutionCapable: true
        CFBundleName: Make It 3D
        CFBundleDisplayName: Make It 3D
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "Copyright 2026 Russell White. MIT licensed."
