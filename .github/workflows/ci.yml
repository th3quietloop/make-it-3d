name: macOS regression gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Install build tools
        run: brew install xcodegen
      - name: Metal compiler
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: >-
          xcodebuild -project MakeIt3D.xcodeproj -scheme MakeIt3D
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          -derivedDataPath build -resultBundlePath build/Regression.xcresult
          -skip-testing:MakeIt3DTests/EngineRegressionTests/testGeneratedMediaRegressions
          CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-regression-results
          path: build/Regression.xcresult
# Hardware encoding, full media-integrity probes and Vision Pro viewing are
# release gates on a physical Apple Silicon Mac. Hosted VMs do not prove them.
